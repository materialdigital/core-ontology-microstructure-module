
name: Simple Build Ontology
on:
  # repository_dispatch:
  #   types: [trigger-qc]
  workflow_dispatch:

env:
  DEFAULT_BRANCH: main

jobs:
  ontology_qc:
    # Use latest Ubuntu runner for stability
    runs-on: ubuntu-latest
    
    container: obolibrary/odkfull:v1.6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build pmdco-full.owl
        run: cd src/ontology && robot merge --catalog catalog-v001.xml -i pmdco-edit.owl annotate --ontology-iri https://w3id.org/pmd/co/pmdco-full.owl -o ../../pmdco-full.owl

      - name: Commit files # commit the src folder
        uses: EndBug/add-and-commit@v9
        with:
          message: "updated ontology"
          cwd: "." 
          add: "*.owl *.ttl src/**/* --force" 
          default_author: github_actions
