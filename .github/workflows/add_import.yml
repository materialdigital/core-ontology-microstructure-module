name: Add/refresh a single import
on:
  workflow_dispatch:
    inputs:
      import_id:
        description: "Import id as in pmdco-odk.yaml (e.g. pato)"
        required: true
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    container: obolibrary/odkfull:v1.6   # same image as the other workflows, avoids Makefile churn
    env:
      IMP_ID: ${{ inputs.import_id }}
    steps:
      - name: Refuse to run on main
        if: github.ref_name == 'main'
        run: exit 1
      - uses: actions/checkout@v4
      - name: Validate input
        run: echo "$IMP_ID" | grep -Eq '^[a-z0-9_]+$'
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: ODK update (regenerates Makefile, catalog, docs)
        run: cd src/ontology && odk.py update
      - name: Build only the new import
        run: cd src/ontology && make refresh-$IMP_ID ROBOT_ENV='ROBOT_JAVA_ARGS=-Xmx6G'
      - name: Quick checks (reasoner + SPARQL), no imports rebuilt
        run: cd src/ontology && make IMP=false MIR=false PAT=false COMP=false reason_test sparql_test
      - uses: EndBug/add-and-commit@v9
        with:
          message: "Add ${{ inputs.import_id }} import (ODK)"
          add: "src/ontology docs"     # no --force, so mirror/ stays out
          default_author: github_actions
